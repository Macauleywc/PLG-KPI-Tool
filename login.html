<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PLG Central — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5ead8;--surface:#ebddc5;--o:#c67139;--o-dk:#b2622d;--text:#201e1d;
  --border:rgba(32,30,29,0.16);--muted:rgba(32,30,29,0.55);
  --heading:'Caprasimo',system-ui,sans-serif;--body:'Figtree',system-ui,sans-serif;
}
body{
  font-family:var(--body);background:var(--bg);
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
}
.login-wrap{ width:100%;max-width:400px;padding:24px; }
.brand{text-align:center;margin-bottom:28px;}
.brand-mark{
  width:64px;height:64px;border-radius:20px;
  background:var(--o);display:inline-flex;
  align-items:center;justify-content:center;margin-bottom:16px;
}
.brand-name{
  font-size:11px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-bottom:6px;
}
.brand-title{
  font-family:var(--heading);font-weight:400;font-size:24px;color:var(--text);letter-spacing:-.01em;
}
.brand-sub{font-size:12px;color:var(--muted);margin-top:5px;}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:24px;
  padding:28px;box-shadow:0 3px 10px rgba(46,43,37,0.16);
}
.card-title{
  font-family:var(--heading);font-weight:400;font-size:19px;color:var(--text);margin-bottom:5px;
}
.card-sub{font-size:12px;color:var(--muted);margin-bottom:22px;}
.field{margin-bottom:16px;}
.field label{
  display:block;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.1em;
  color:var(--muted);margin-bottom:7px;
}
.field-wrap{position:relative;}
.field input{
  width:100%;background:var(--bg);border:1px solid var(--border);
  border-radius:12px;padding:11px 44px 11px 14px;
  font-size:14px;color:var(--text);font-family:var(--body);
  transition:border-color .2s;outline:none;
}
.field input::placeholder{color:var(--muted);}
.field input:focus{border-color:var(--o);}
.field-icon{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:16px;cursor:pointer;user-select:none;
  transition:color .2s;
}
.field-icon:hover{color:var(--text);}
.error-msg{
  display:none;background:#fdeceb;border:1px solid #eab3ab;
  border-radius:12px;padding:10px 14px;margin-bottom:16px;
  font-size:12px;color:#b3261e;line-height:1.5;
}
.error-msg.show{display:block;}
.btn-login{
  width:100%;background:var(--o);color:var(--bg);border:none;
  border-radius:999px;padding:12px;font-size:14px;font-weight:600;
  font-family:var(--heading);cursor:pointer;letter-spacing:.01em;
  transition:all .2s;display:flex;align-items:center;
  justify-content:center;gap:8px;
}
.btn-login:hover{background:var(--o-dk);}
.btn-login.loading{opacity:.7;pointer-events:none;}
.footer{
  text-align:center;margin-top:22px;
  font-size:11px;color:var(--muted);line-height:1.6;
}
</style>
</head>
<body>

<div class="login-wrap">
  <div class="brand">
    <div class="brand-mark">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f5ead8" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 19 5"/><path d="M9 5h10v10"/></svg>
    </div>
    <div class="brand-name">Premier Logistics Group</div>
    <div class="brand-title">PLG Central</div>
    <div class="brand-sub">Internal tools</div>
  </div>

  <div class="card">
    <div class="card-title">Sign in to continue</div>
    <div class="card-sub">Enter your credentials to access the platform</div>

    <div class="error-msg" id="error-msg">
      Incorrect password. Please try again.
    </div>

    <div class="field">
      <label>Username</label>
      <div class="field-wrap">
        <input type="text" id="username" placeholder="e.g. macauley" autocomplete="username" autocapitalize="none">
        <span class="field-icon">&#128100;</span>
      </div>
    </div>

    <div class="field">
      <label>Password</label>
      <div class="field-wrap">
        <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
        <span class="field-icon" id="toggle-pw" onclick="togglePw()" title="Show/hide">&#128065;</span>
      </div>
    </div>

    <button class="btn-login" id="btn-login" onclick="doLogin()">
      <span id="btn-text">Sign in &#8594;</span>
    </button>
  </div>

  <div class="footer">
    <span>Authorised PLG personnel only</span><br>
    Contact your system administrator if you need access
  </div>
</div>

<script>
var SB_URL = 'https://ahvyirnebbbfmktewdva.supabase.co';
var SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFodnlpcm5lYmJiZm1rdGV3ZHZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2ODQxMzAsImV4cCI6MjA5MjI2MDEzMH0.4uOvx11sNPOYGRSAxu4J7MwtgOQpHJsNtCg2BaP1Y3c';

async function sha256(str){
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function showError(msg){
  var el = document.getElementById('error-msg');
  el.textContent = msg || 'Incorrect password. Please try again.';
  el.classList.add('show');
}

function clearError(){
  document.getElementById('error-msg').classList.remove('show');
}

function togglePw(){
  var inp = document.getElementById('password');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

async function doLogin(){
  clearError();
  var username = document.getElementById('username').value.trim().toLowerCase();
  var password = document.getElementById('password').value;
  var btn = document.getElementById('btn-login');
  var btnText = document.getElementById('btn-text');

  if(!username){ showError('Please enter your username.'); document.getElementById('username').focus(); return; }
  if(!password){ showError('Please enter your password.'); document.getElementById('password').focus(); return; }

  btn.classList.add('loading');
  btnText.textContent = 'Signing in...';

  var hashed = await sha256(password);

  try{
    var res = await fetch(SB_URL + '/rest/v1/rpc/kpi_verify_login', {
      method:'POST',
      headers:{'apikey':SB_ANON,'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},
      body: JSON.stringify({p_username:username, p_password_hash:hashed})
    });
    var data = await res.json();

    if(data && data.valid){
      sessionStorage.setItem('plg_auth', btoa(data.username + ':' + Date.now()));
      sessionStorage.setItem('plg_role', data.role || 'user');
      sessionStorage.setItem('plg_name', data.name || data.username);
      sessionStorage.setItem('plg_username', data.username);
      sessionStorage.setItem('plg_modules', JSON.stringify(data.modules || ['home','reports','import']));
      btnText.textContent = 'Redirecting...';
      setTimeout(function(){ window.location.href = 'index.html'; }, 300);
      return;
    }
    btn.classList.remove('loading');
    btnText.textContent = 'Sign in →';
    showError('Incorrect username or password.');
    document.getElementById('password').value = '';
    document.getElementById('password').focus();
  }catch(e){
    btn.classList.remove('loading');
    btnText.textContent = 'Sign in →';
    showError('Could not reach login service. Check your connection and try again.');
  }
}

if(sessionStorage.getItem('plg_auth')){
  window.location.href = 'index.html';
}
</script>
</body>
</html>
