<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PLG Central — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --o:#F47920;--o-dk:#E06810;--dk:#121212;
  --border:#1f1f1f;--font:'Inter',sans-serif;
}
body{
  font-family:var(--font);background:var(--dk);
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;
  background:linear-gradient(135deg,#0c0c0c 0%,#181818 50%,#0c0c0c 100%);
  z-index:0;
}
body::after{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(
    45deg,transparent,transparent 40px,
    rgba(244,121,32,0.015) 40px,rgba(244,121,32,0.015) 41px
  );
  z-index:0;
}
.login-wrap{
  position:relative;z-index:1;
  width:100%;max-width:400px;padding:24px;
}
.brand{text-align:center;margin-bottom:32px;}
.brand-logo{
  width:76px;height:76px;border-radius:20px;
  background:linear-gradient(155deg,var(--o) 0%,var(--o-dk) 100%);
  display:inline-flex;align-items:center;justify-content:center;margin-bottom:22px;
  box-shadow:0 20px 44px rgba(244,121,32,0.28), 0 2px 6px rgba(0,0,0,0.4);
}
.brand-logo svg{width:38px;height:38px;}
.brand-name{
  font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:#444;margin-bottom:6px;
}
.brand-title{
  font-size:22px;font-weight:700;color:#fff;letter-spacing:-.02em;
}
.brand-sub{font-size:12px;color:#3e3e3e;margin-top:5px;}
.card{
  background:#161616;border:1px solid #1f1f1f;border-radius:12px;
  padding:28px;box-shadow:0 24px 80px rgba(0,0,0,0.6);
}
.accent-bar{
  height:2px;background:var(--o);border-radius:2px 2px 0 0;
  margin:-28px -28px 24px;
}
.card-title{
  font-size:15px;font-weight:700;color:#e8e8e8;margin-bottom:5px;
}
.card-sub{font-size:12px;color:#444;margin-bottom:22px;}
.field{margin-bottom:16px;}
.field label{
  display:block;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.1em;
  color:#484848;margin-bottom:7px;
}
.field-wrap{position:relative;}
.field input{
  width:100%;background:#1e1e1e;border:1px solid #262626;
  border-radius:7px;padding:11px 44px 11px 14px;
  font-size:14px;color:#e0e0e0;font-family:var(--font);
  transition:border-color .2s;outline:none;
  -webkit-text-security:disc;
}
.field input[type=text]{-webkit-text-security:none;}
.field input::placeholder{color:#383838;}
.field input:focus{border-color:var(--o);background:#222;}
.field-icon{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  color:#383838;font-size:16px;cursor:pointer;user-select:none;
  transition:color .2s;
}
.field-icon:hover{color:#777;}
.error-msg{
  display:none;background:#1a0a0a;border:1px solid #3d1212;
  border-radius:7px;padding:10px 14px;margin-bottom:16px;
  font-size:12px;color:#f87171;line-height:1.5;
}
.error-msg.show{display:block;}
.btn-login{
  width:100%;background:var(--o);color:#fff;border:none;
  border-radius:7px;padding:12px;font-size:14px;font-weight:700;
  font-family:var(--font);cursor:pointer;letter-spacing:.01em;
  transition:all .2s;display:flex;align-items:center;
  justify-content:center;gap:8px;
}
.btn-login:hover{background:var(--o-dk);transform:translateY(-1px);
  box-shadow:0 6px 20px rgba(244,121,32,0.3);}
.btn-login:active{transform:translateY(0);}
.btn-login.loading{opacity:.7;pointer-events:none;}
.footer{
  text-align:center;margin-top:22px;
  font-size:11px;color:#333;line-height:1.6;
}
.footer span{color:#2e2e2e;}
</style>
</head>
<body>

<div class="login-wrap">
  <div class="brand">
    <div class="brand-logo">
      <svg viewBox="0 0 24 24" fill="none">
        <circle cx="5" cy="18" r="2.6" fill="white"/>
        <circle cx="19" cy="6" r="2.6" fill="white"/>
        <circle cx="12" cy="12" r="2.2" fill="white" opacity="0.55"/>
        <path d="M6.9 16.4 L10.3 13.4 M13.7 10.6 L17.1 7.6" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="brand-name">Premier Logistics Group</div>
    <div class="brand-title">PLG Central</div>
    <div class="brand-sub">Internal tools</div>
  </div>

  <div class="card">
    <div class="accent-bar"></div>
    <div class="card-title">Sign in to continue</div>
    <div class="card-sub">Enter your credentials to access the platform</div>

    <div class="error-msg" id="error-msg">
      Incorrect password. Please try again.
    </div>

    <div class="field">
      <label>Username</label>
      <div class="field-wrap">
        <input type="text" id="username" placeholder="e.g. macauley" autocomplete="username" autocapitalize="none">
        <span class="field-icon">&#128100;</span>
      </div>
    </div>

    <div class="field">
      <label>Password</label>
      <div class="field-wrap">
        <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
        <span class="field-icon" id="toggle-pw" onclick="togglePw()" title="Show/hide">&#128065;</span>
      </div>
    </div>

    <button class="btn-login" id="btn-login" onclick="doLogin()">
      <span id="btn-text">Sign in &#8594;</span>
    </button>
  </div>

  <div class="footer">
    <span>Authorised PLG personnel only</span><br>
    Contact your system administrator if you need access
  </div>
</div>

<script>
var SB_URL = 'https://ahvyirnebbbfmktewdva.supabase.co';
var SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFodnlpcm5lYmJiZm1rdGV3ZHZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2ODQxMzAsImV4cCI6MjA5MjI2MDEzMH0.4uOvx11sNPOYGRSAxu4J7MwtgOQpHJsNtCg2BaP1Y3c';

async function sha256(str){
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function showError(msg){
  var el = document.getElementById('error-msg');
  el.textContent = msg || 'Incorrect password. Please try again.';
  el.classList.add('show');
}

function clearError(){
  document.getElementById('error-msg').classList.remove('show');
}

function togglePw(){
  var inp = document.getElementById('password');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

async function doLogin(){
  clearError();
  var username = document.getElementById('username').value.trim().toLowerCase();
  var password = document.getElementById('password').value;
  var btn = document.getElementById('btn-login');
  var btnText = document.getElementById('btn-text');

  if(!username){ showError('Please enter your username.'); document.getElementById('username').focus(); return; }
  if(!password){ showError('Please enter your password.'); document.getElementById('password').focus(); return; }

  btn.classList.add('loading');
  btnText.textContent = 'Signing in...';

  var hashed = await sha256(password);

  try{
    var res = await fetch(SB_URL + '/rest/v1/rpc/kpi_verify_login', {
      method:'POST',
      headers:{'apikey':SB_ANON,'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},
      body: JSON.stringify({p_username:username, p_password_hash:hashed})
    });
    var data = await res.json();

    if(data && data.valid){
      sessionStorage.setItem('plg_auth', btoa(data.username + ':' + Date.now()));
      sessionStorage.setItem('plg_role', data.role || 'user');
      sessionStorage.setItem('plg_name', data.name || data.username);
      sessionStorage.setItem('plg_username', data.username);
      // data.modules may not exist yet if the Supabase migration hasn't been applied —
      // fall back to a safe default so login still works either way.
      sessionStorage.setItem('plg_modules', JSON.stringify(data.modules || ['home','reports','import']));
      btnText.textContent = 'Redirecting...';
      setTimeout(function(){ window.location.href = 'index.html'; }, 300);
      return;
    }
    btn.classList.remove('loading');
    btnText.textContent = 'Sign in →';
    showError('Incorrect username or password.');
    document.getElementById('password').value = '';
    document.getElementById('password').focus();
  }catch(e){
    btn.classList.remove('loading');
    btnText.textContent = 'Sign in →';
    showError('Could not reach login service. Check your connection and try again.');
  }
}

// If already authenticated, skip login
if(sessionStorage.getItem('plg_auth')){
  window.location.href = 'index.html';
}
</script>
</body>
</html>
