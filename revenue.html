<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="shared/config.js"></script>
<script src="shared/auth-guard.js" data-module="revenue"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revenue Report — PLG Central</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/platform.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
.rp-header { padding: 28px 36px 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
.rp-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.rp-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

.rp-upload-btn {
  background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
  color: var(--text); font-size: 13px; font-weight: 600; font-family: var(--font-body);
  padding: 9px 18px; cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.rp-upload-btn:hover { background: var(--faint); border-color: var(--orange); }
#rp-file-input { display: none; }

.rp-error {
  display: none; margin: 16px 36px 0; background: #FEF2F2; border: 1px solid #FCA5A5;
  color: #991B1B; padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 500;
}
.rp-error.show { display: block; }
.rp-notice {
  display: none; margin: 16px 36px 0; background: #F0FDF4; border: 1px solid #86EFAC;
  color: #166534; padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 500;
}
.rp-notice.show { display: block; }

.rp-loading { padding: 24px 36px; color: var(--muted); font-size: 13px; }
.rp-body { display: none; }
.rp-body.show { display: block; }

/* Controls bar */
.rp-controls {
  display: flex; align-items: center; gap: 20px; padding: 14px 36px; flex-wrap: wrap;
  border-bottom: 1px solid var(--border); margin-bottom: 4px;
}
.rp-control-group { display: flex; align-items: center; gap: 8px; }
.rp-control-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-right: 2px; }
.rp-seg { display: flex; background: var(--faint); border-radius: 999px; padding: 3px; gap: 2px; }
.rp-seg-btn {
  border: none; background: none; border-radius: 999px; padding: 6px 14px; font-size: 12px;
  font-weight: 600; color: var(--muted); cursor: pointer; font-family: var(--font-body); transition: all 0.15s;
}
.rp-seg-btn.active { background: var(--orange); color: #fff; }
.rp-fleet-input-wrap { display: flex; align-items: center; gap: 6px; }
.rp-fleet-input {
  width: 54px; border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px;
  font-size: 12px; font-family: var(--font-body); background: var(--surface); color: var(--text);
}
.rp-fleet-save {
  border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 5px 10px;
  font-size: 11px; font-weight: 600; cursor: pointer; color: var(--muted);
}
.rp-fleet-save:hover { color: var(--text); border-color: var(--orange); }

.metrics-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px; padding: 20px 36px;
}
.metric-card {
  background: var(--surface); border-radius: 20px; padding: 20px;
  border: 2px solid var(--border); display: flex; flex-direction: column; gap: 10px;
  transition: all 0.2s ease;
}
.metric-card:hover { border-color: var(--orange); box-shadow: 0 4px 16px rgba(198,113,57,0.1); }
.metric-top { display: flex; justify-content: space-between; align-items: flex-start; }
.metric-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
.metric-icon {
  width: 36px; height: 36px; border-radius: 12px; background: var(--orange-dim); color: var(--orange);
  display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
}
.metric-value { font-family: var(--font-heading); font-size: 26px; font-weight: 600; color: var(--orange); }
.metric-value.plain { color: var(--text); }
.metric-change { font-size: 12px; color: var(--muted); }

.content-section {
  background: var(--surface); border-radius: 20px; border: 2px solid var(--border);
  padding: 24px; margin: 0 36px 24px;
}
.section-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px;
}
.section-title { font-family: var(--font-heading); font-size: 17px; font-weight: 600; color: var(--text); margin: 0; }
.section-note { font-size: 12px; color: var(--muted); }

.chart-wrap { position: relative; height: 280px; }

.rp-tabs { display: flex; gap: 6px; }
.rp-tab {
  border: 1px solid var(--border); background: var(--faint); border-radius: 999px;
  padding: 6px 14px; font-size: 12px; font-weight: 600; color: var(--muted);
  cursor: pointer; font-family: var(--font-body);
}
.rp-tab.active { background: var(--orange); color: #fff; border-color: var(--orange); }

table.rp-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.rp-table th {
  background: var(--faint); color: var(--muted); padding: 9px 12px; text-align: right;
  font-weight: 700; border-bottom: 1px solid var(--border); font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap;
}
table.rp-table th:first-child, table.rp-table td:first-child { text-align: left; position: sticky; left: 0; background: var(--faint); }
table.rp-table td:first-child { background: var(--surface); font-weight: 600; }
table.rp-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
table.rp-table tbody tr:hover td { background: var(--faint); }
table.rp-table tbody tr:hover td:first-child { background: var(--faint); }

@media (max-width: 700px) {
  .rp-header, .metrics-grid, .content-section, .rp-controls { padding-left: 16px; padding-right: 16px; }
  .content-section { margin-left: 16px; margin-right: 16px; }
}
</style>
</head>
<body>

<div class="plg-layout">
<div id="plg-sidebar-root"></div>
<div class="plg-content">

  <div class="rp-header">
    <div>
      <div class="rp-title">Revenue Report</div>
      <div class="rp-sub" id="rp-sub">Loading weekly turnover data&hellip;</div>
    </div>
    <div id="rp-admin-controls" style="display:none">
      <button class="rp-upload-btn" onclick="document.getElementById('rp-file-input').click()">&#8593; Upload weekly turnover</button>
      <input type="file" id="rp-file-input" accept=".xlsx" onchange="handleUpload(event)">
    </div>
  </div>

  <div class="rp-error" id="rp-error"></div>
  <div class="rp-notice" id="rp-notice"></div>
  <div class="rp-loading" id="rp-loading">Fetching turnover records&hellip;</div>

  <div class="rp-body" id="rp-body">

    <div class="rp-controls">
      <div class="rp-control-group">
        <span class="rp-control-label">View</span>
        <div class="rp-seg" id="seg-granularity">
          <button class="rp-seg-btn active" data-val="weekly" onclick="setGranularity('weekly')">Weekly</button>
          <button class="rp-seg-btn" data-val="daily" onclick="setGranularity('daily')">Daily</button>
        </div>
      </div>
      <div class="rp-control-group">
        <span class="rp-control-label">Department</span>
        <div class="rp-seg" id="seg-department">
          <button class="rp-seg-btn active" data-val="all" onclick="setDepartment('all')">All</button>
          <button class="rp-seg-btn" data-val="palletforce" onclick="setDepartment('palletforce')">Palletforce</button>
          <button class="rp-seg-btn" data-val="haulage" onclick="setDepartment('haulage')">General Haulage</button>
          <button class="rp-seg-btn" data-val="fleet" onclick="setDepartment('fleet')">Fleet &amp; Staffing</button>
        </div>
      </div>
      <div class="rp-control-group" id="fleet-size-control" style="display:none">
        <span class="rp-control-label">Total Fleet Size</span>
        <div class="rp-fleet-input-wrap">
          <input type="number" class="rp-fleet-input" id="fleet-size-input" min="1">
          <button class="rp-fleet-save" onclick="saveFleetSize()">Save</button>
        </div>
      </div>
    </div>

    <div class="metrics-grid" id="metrics-grid"></div>

    <div class="content-section">
      <div class="section-header">
        <div class="section-title" id="chart-title">Trend</div>
        <div class="rp-tabs">
          <button class="rp-tab active" id="tab-26" onclick="setChartRange(26)">6 months</button>
          <button class="rp-tab" id="tab-52" onclick="setChartRange(52)">1 year</button>
          <button class="rp-tab" id="tab-999" onclick="setChartRange(999)">All time</button>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="chart-main"></canvas></div>
    </div>

    <div class="content-section">
      <div class="section-header">
        <div class="section-title">Data table</div>
        <div class="section-note" id="rp-table-note">Most recent first</div>
      </div>
      <div class="tracker-table-wrap" style="overflow-x:auto">
        <table class="rp-table" id="rp-table">
          <thead id="rp-table-head"></thead>
          <tbody id="rp-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>
</div>
<script src="shared/sidebar.js"></script>
<script>
PLG.renderSidebar('revenue');

var allWeeks = [];
var allDays = [];
var fleetSize = 25;
var chartInstance = null;
var chartRange = 26;
var granularity = 'weekly'; // 'weekly' | 'daily'
var department = 'all';     // 'all' | 'palletforce' | 'haulage' | 'fleet'

function fmtGBP(n, decimals) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return '£' + Number(n).toLocaleString('en-GB', {minimumFractionDigits: decimals || 0, maximumFractionDigits: decimals || 0});
}
function fmtNum(n, decimals) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('en-GB', {minimumFractionDigits: decimals || 0, maximumFractionDigits: decimals || 0});
}
function fmtPct(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return (Number(n) * 100).toFixed(1) + '%';
}
function fmtWeekLabel(wc) {
  var m = String(wc).match(/(\d{2})-(\d{2})-(\d{4})/);
  if (!m) return wc;
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return m[1] + ' ' + MONTHS[parseInt(m[2], 10) - 1] + " '" + m[3].slice(2);
}
function fmtDayLabel(d) {
  var dt = new Date(d);
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return dt.getDate() + ' ' + MONTHS[dt.getMonth()];
}

function showError(msg) {
  var el = document.getElementById('rp-error');
  el.textContent = msg;
  el.classList.add('show');
  document.getElementById('rp-loading').style.display = 'none';
}
function showNotice(msg) {
  var el = document.getElementById('rp-notice');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 6000);
}

async function loadRevenueData() {
  try {
    var res = await fetch(PLG.KPI_DATA_URL, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'revenue_weeks'})
    });
    var payload = await res.json();
    if (!res.ok || payload.error) { showError('Could not load weekly data: ' + (payload.error || ('HTTP ' + res.status))); return; }
    allWeeks = payload.weeks || [];

    var res2 = await fetch(PLG.KPI_DATA_URL, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'revenue_days'})
    });
    var payload2 = await res2.json();
    if (res2.ok && !payload2.error) allDays = payload2.days || [];

    var res3 = await fetch(PLG.KPI_DATA_URL, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'revenue_settings'})
    });
    var payload3 = await res3.json();
    if (res3.ok && payload3.settings && payload3.settings.total_fleet_size) fleetSize = payload3.settings.total_fleet_size;
    document.getElementById('fleet-size-input').value = fleetSize;

    renderAll();
  } catch (e) {
    showError('Could not reach the shared data service: ' + e.message);
  }
}

function setGranularity(g) {
  granularity = g;
  document.querySelectorAll('#seg-granularity .rp-seg-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.val === g); });
  renderAll();
}
function setDepartment(d) {
  department = d;
  document.querySelectorAll('#seg-department .rp-seg-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.val === d); });
  document.getElementById('fleet-size-control').style.display = (d === 'fleet' && sessionStorage.getItem('plg_role') === 'admin') ? 'flex' : 'none';
  renderAll();
}
function setChartRange(n) {
  chartRange = n;
  ['26', '52', '999'].forEach(function(k) { document.getElementById('tab-' + k).classList.toggle('active', String(n) === k); });
  renderChart();
}

async function saveFleetSize() {
  var v = parseInt(document.getElementById('fleet-size-input').value, 10);
  if (!v || v < 1) { showError('Enter a valid fleet size.'); return; }
  var secret = getAdminSecret();
  if (!secret) { showError('Admin secret required. Set it via Users panel first.'); return; }
  try {
    var res = await fetch(PLG.EDGE_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'x-admin-secret': secret},
      body: JSON.stringify({action: 'revenue_set_setting', key: 'total_fleet_size', value: v})
    });
    var result = await res.json();
    if (!res.ok || result.error) { showError('Could not save: ' + (result.error || ('HTTP ' + res.status))); return; }
    fleetSize = v;
    showNotice('Fleet size updated to ' + v + '.');
    renderAll();
  } catch (e) { showError('Error: ' + e.message); }
}
function getAdminSecret() { return localStorage.getItem('plg_admin_secret') || ''; }

function activeRows() {
  var rows = granularity === 'weekly' ? allWeeks.slice() : allDays.slice();
  var dateKey = granularity === 'weekly' ? 'week_date' : 'day_date';
  rows.sort(function(a, b) { return new Date(a[dateKey]) - new Date(b[dateKey]); });
  return rows;
}

function renderAll() {
  document.getElementById('rp-loading').style.display = 'none';
  document.getElementById('rp-body').classList.add('show');

  var rows = activeRows();
  if (rows.length === 0) {
    document.getElementById('rp-sub').textContent = 'No turnover data yet.';
    return;
  }
  var dateKey = granularity === 'weekly' ? 'week_date' : 'day_date';
  var labelFn = granularity === 'weekly' ? function(r){return fmtWeekLabel(r.week_commencing);} : function(r){return fmtDayLabel(r.day_date);};

  document.getElementById('rp-sub').textContent = rows.length + ' ' + (granularity === 'weekly' ? 'weeks' : 'days') + ' of data \u00b7 ' + labelFn(rows[0]) + ' \u2192 ' + labelFn(rows[rows.length - 1]);

  renderMetrics(rows);
  renderChart();
  renderTable(rows, labelFn);
}

function activeFleet(r) {
  var stood = parseFloat(r.trucks_stood) || 0;
  var vor = parseFloat(r.trucks_vor) || 0;
  return Math.max(fleetSize - stood - vor, 0);
}

function renderMetrics(rows) {
  var grid = document.getElementById('metrics-grid');
  var n = rows.length;

  if (department === 'all') {
    var totalKey = granularity === 'weekly' ? 'grand_total' : null; // daily has no reliable grand total
    var totals = rows.map(function(r) {
      if (granularity === 'weekly') return parseFloat(r.grand_total) || 0;
      return (parseFloat(r.pf_coll) || 0) + (parseFloat(r.pf_del) || 0) + (parseFloat(r.general_total) || 0);
    });
    var avg = totals.reduce(function(a, b) { return a + b; }, 0) / n;
    var bestIdx = totals.indexOf(Math.max.apply(null, totals));
    var margins = rows.filter(function(r) { return r.subbed_margin != null; }).map(function(r) { return parseFloat(r.subbed_margin); });
    var avgMargin = margins.length ? margins.reduce(function(a, b) { return a + b; }, 0) / margins.length : null;
    var avgPallets = rows.reduce(function(a, r) { return a + (parseFloat(r.pallets) || 0); }, 0) / n;
    var avgActiveFleet = rows.reduce(function(a, r) { return a + activeFleet(r); }, 0) / n;
    var revPerTruck = avgActiveFleet > 0 ? avg / avgActiveFleet : null;

    grid.innerHTML = metricCard('&#163;', granularity === 'weekly' ? 'Avg Weekly Total' : 'Avg Daily Total', fmtGBP(avg), true)
      + metricCard('&#127942;', 'Best ' + (granularity === 'weekly' ? 'Week' : 'Day'), fmtGBP(totals[bestIdx]), false, (granularity === 'weekly' ? fmtWeekLabel(rows[bestIdx].week_commencing) : fmtDayLabel(rows[bestIdx].day_date)))
      + metricCard('&#128202;', 'Avg Margin %', fmtPct(avgMargin), false)
      + metricCard('&#128230;', 'Avg Pallets', fmtNum(avgPallets, 0), false)
      + metricCard('&#128666;', 'Revenue / Active Truck', fmtGBP(revPerTruck), false, avgActiveFleet.toFixed(1) + ' avg active trucks');
  }

  else if (department === 'palletforce') {
    var pfTotals = rows.map(function(r) { return (parseFloat(r.pf_coll) || 0) + (parseFloat(r.pf_del) || 0); });
    var avgPf = pfTotals.reduce(function(a, b) { return a + b; }, 0) / n;
    var totalPallets = rows.reduce(function(a, r) { return a + (parseFloat(r.pallets) || 0); }, 0);
    var totalFails = rows.reduce(function(a, r) { return a + (parseFloat(r.pf_fails) || 0); }, 0);
    var perPallet = totalPallets > 0 ? rows.reduce(function(a, r) { return a + (parseFloat(r.pf_coll) || 0) + (parseFloat(r.pf_del) || 0); }, 0) / totalPallets : null;

    grid.innerHTML = metricCard('&#163;', granularity === 'weekly' ? 'Avg Weekly PF Revenue' : 'Avg Daily PF Revenue', fmtGBP(avgPf), true)
      + metricCard('&#128230;', 'Total Pallets', fmtNum(totalPallets, 0), false)
      + metricCard('&#9888;', 'Total PF Fails', fmtNum(totalFails, 0), false)
      + metricCard('&#163;', '£ / Pallet', fmtGBP(perPallet, 2), false);
  }

  else if (department === 'haulage') {
    var ownFleet = rows.reduce(function(a, r) { return a + (parseFloat(r.gen_own_fleet) || 0); }, 0);
    var vpkFleet = rows.reduce(function(a, r) { return a + (parseFloat(r.vpk_fleet) || 0); }, 0);
    var groupColl = rows.reduce(function(a, r) { return a + (parseFloat(r.group_coll) || 0); }, 0);
    var subbedRev = rows.reduce(function(a, r) { return a + (parseFloat(r.subbed_rev) || 0); }, 0);
    var haulageMargins = rows.filter(function(r) { return r.subbed_margin != null; }).map(function(r) { return parseFloat(r.subbed_margin); });
    var avgHaulageMargin = haulageMargins.length ? haulageMargins.reduce(function(a, b) { return a + b; }, 0) / haulageMargins.length : null;

    grid.innerHTML = metricCard('&#128666;', 'Own Fleet Total', fmtGBP(ownFleet), true)
      + metricCard('&#128666;', 'VPK Fleet Total', fmtGBP(vpkFleet), false)
      + metricCard('&#163;', 'Group Coll Total', fmtGBP(groupColl), false)
      + metricCard('&#163;', 'Subbed Revenue Total', fmtGBP(subbedRev), false)
      + metricCard('&#128202;', 'Avg Margin %', fmtPct(avgHaulageMargin), false);
  }

  else if (department === 'fleet') {
    var avgStood = rows.reduce(function(a, r) { return a + (parseFloat(r.trucks_stood) || 0); }, 0) / n;
    var avgVor = rows.reduce(function(a, r) { return a + (parseFloat(r.trucks_vor) || 0); }, 0) / n;
    var totalsF = rows.map(function(r) {
      if (granularity === 'weekly') return parseFloat(r.grand_total) || 0;
      return (parseFloat(r.pf_coll) || 0) + (parseFloat(r.pf_del) || 0) + (parseFloat(r.general_total) || 0);
    });
    var avgTotalF = totalsF.reduce(function(a, b) { return a + b; }, 0) / n;
    var avgActiveF = rows.reduce(function(a, r) { return a + activeFleet(r); }, 0) / n;
    var revPerTruckF = avgActiveF > 0 ? avgTotalF / avgActiveF : null;

    grid.innerHTML = metricCard('&#128665;', 'Total Fleet Size', fmtNum(fleetSize, 0), true)
      + metricCard('&#9888;', 'Avg Trucks Stood', fmtNum(avgStood, 1), false)
      + metricCard('&#128295;', 'Avg Trucks VOR', fmtNum(avgVor, 1), false)
      + metricCard('&#9989;', 'Avg Active Trucks', fmtNum(avgActiveF, 1), false)
      + metricCard('&#163;', 'Revenue / Active Truck', fmtGBP(revPerTruckF), false);
  }
}

function metricCard(icon, label, value, isOrange, sub) {
  return '<div class="metric-card"><div class="metric-top"><div class="metric-label">' + label + '</div><div class="metric-icon">' + icon + '</div></div>'
    + '<div class="metric-value' + (isOrange ? '' : ' plain') + '">' + value + '</div>'
    + (sub ? '<div class="metric-change">' + sub + '</div>' : '')
    + '</div>';
}

function seriesForDepartment(rows) {
  if (department === 'all') {
    return rows.map(function(r) {
      if (granularity === 'weekly') return parseFloat(r.grand_total) || 0;
      return (parseFloat(r.pf_coll) || 0) + (parseFloat(r.pf_del) || 0) + (parseFloat(r.general_total) || 0);
    });
  }
  if (department === 'palletforce') return rows.map(function(r) { return (parseFloat(r.pf_coll) || 0) + (parseFloat(r.pf_del) || 0); });
  if (department === 'haulage') return rows.map(function(r) { return parseFloat(r.general_total) || 0; });
  if (department === 'fleet') return rows.map(function(r) { return activeFleet(r) > 0 ? ((granularity === 'weekly' ? (parseFloat(r.grand_total) || 0) : ((parseFloat(r.pf_coll) || 0) + (parseFloat(r.pf_del) || 0) + (parseFloat(r.general_total) || 0))) / activeFleet(r)) : 0; });
  return rows.map(function() { return 0; });
}

function chartLabel() {
  if (department === 'all') return granularity === 'weekly' ? 'Grand Total by week' : 'Total (PF + General) by day';
  if (department === 'palletforce') return 'Palletforce revenue';
  if (department === 'haulage') return 'General Haulage total';
  if (department === 'fleet') return 'Revenue per active truck';
  return 'Trend';
}

function renderChart() {
  var rows = activeRows();
  var slice = chartRange >= rows.length ? rows : rows.slice(rows.length - chartRange);
  var labelFn = granularity === 'weekly' ? function(r){return fmtWeekLabel(r.week_commencing);} : function(r){return fmtDayLabel(r.day_date);};
  var labels = slice.map(labelFn);
  var data = seriesForDepartment(slice);
  document.getElementById('chart-title').textContent = chartLabel();

  var ctx = document.getElementById('chart-main');
  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {labels: labels, datasets: [{label: chartLabel(), data: data, backgroundColor: '#c67139', borderRadius: 3}]},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {legend: {display: false}, tooltip: {callbacks: {label: function(c) { return fmtGBP(c.parsed.y, department === 'fleet' ? 0 : 0); }}}},
      scales: {
        y: {beginAtZero: true, ticks: {callback: function(v) { return '£' + (v >= 1000 ? (v / 1000) + 'k' : v); }, font: {size: 11}}, grid: {color: 'rgba(32,30,29,0.08)'}},
        x: {ticks: {font: {size: 10}, maxRotation: 60, minRotation: slice.length > 20 ? 60 : 0}, grid: {display: false}}
      }
    }
  });
}

function renderTable(rows, labelFn) {
  var head, bodyRows;
  var mostRecentFirst = rows.slice().reverse();
  var dateCol = granularity === 'weekly' ? 'Week Commencing' : 'Date';

  head = '<tr><th>' + dateCol + '</th><th>Grand Total (£)</th><th>PF Coll (£)</th><th>PF Del (£)</th>'
    + '<th>Pallets</th><th>PF Fails</th><th>Gen Own Fleet (£)</th><th>VPK Fleet (£)</th>'
    + '<th>Group Coll (£)</th><th>Subbed Rev (£)</th><th>Subbed Cost (£)</th><th>General Total (£)</th>'
    + '<th>Subbed Margin %</th><th>Trucks Stood</th><th>Trucks VOR</th></tr>';

  bodyRows = mostRecentFirst.map(function(r) {
    var dateLabel = granularity === 'weekly' ? r.week_commencing : fmtDayLabel(r.day_date) + ' ' + new Date(r.day_date).getFullYear();
    var grandDisplay = granularity === 'weekly' ? fmtGBP(r.grand_total) : fmtGBP((parseFloat(r.pf_coll) || 0) + (parseFloat(r.pf_del) || 0) + (parseFloat(r.general_total) || 0));
    return '<tr>'
      + '<td>' + dateLabel + '</td>'
      + '<td>' + grandDisplay + '</td>'
      + '<td>' + fmtGBP(r.pf_coll) + '</td>'
      + '<td>' + fmtGBP(r.pf_del) + '</td>'
      + '<td>' + fmtNum(r.pallets) + '</td>'
      + '<td>' + fmtNum(r.pf_fails) + '</td>'
      + '<td>' + fmtGBP(r.gen_own_fleet) + '</td>'
      + '<td>' + fmtGBP(r.vpk_fleet) + '</td>'
      + '<td>' + fmtGBP(r.group_coll) + '</td>'
      + '<td>' + fmtGBP(r.subbed_rev) + '</td>'
      + '<td>' + fmtGBP(r.subbed_cost) + '</td>'
      + '<td>' + fmtGBP(r.general_total) + '</td>'
      + '<td>' + fmtPct(r.subbed_margin) + '</td>'
      + '<td>' + fmtNum(r.trucks_stood) + '</td>'
      + '<td>' + fmtNum(r.trucks_vor) + '</td>'
      + '</tr>';
  }).join('');

  document.getElementById('rp-table-head').innerHTML = head;
  document.getElementById('rp-table-body').innerHTML = bodyRows;
  document.getElementById('rp-table-note').textContent = rows.length + ' ' + (granularity === 'weekly' ? 'weeks' : 'days') + ' \u00b7 most recent first';
}

// ===== ADMIN UPLOAD (weekly Dashboard-sheet backfill/refresh) =====
async function handleUpload(evt) {
  var file = evt.target.files[0];
  if (!file) return;
  var secret = getAdminSecret();
  if (!secret) { showError('Admin secret required to upload. Set it via Users/Settings first.'); evt.target.value = ''; return; }

  try {
    var data = await file.arrayBuffer();
    var wb = XLSX.read(data, {type: 'array'});
    if (wb.SheetNames.indexOf('Dashboard') === -1) {
      showError('No "Dashboard" sheet found in this file \u2014 expected the same layout as the Weekly Turnover workbook.');
      evt.target.value = '';
      return;
    }
    var ws = wb.Sheets['Dashboard'];
    var rows = XLSX.utils.sheet_to_json(ws, {header: 1, range: 9});
    var weeks = [];
    rows.forEach(function(r) {
      if (!r[0] || typeof r[0] !== 'string' || r[0].indexOf('WC') !== 0) return;
      var m = String(r[0]).match(/(\d{2})-(\d{2})-(\d{4})/);
      if (!m) return;
      var weekDate = m[3] + '-' + m[2] + '-' + m[1];
      weeks.push({
        week_commencing: r[0],
        week_date: weekDate,
        grand_total: numOrNull(r[1]), pf_coll: numOrNull(r[2]), pf_del: numOrNull(r[3]),
        pallets: numOrNull(r[4]), pf_fails: numOrNull(r[5]), gen_own_fleet: numOrNull(r[6]),
        vpk_fleet: numOrNull(r[7]), group_coll: numOrNull(r[8]), subbed_rev: numOrNull(r[9]),
        subbed_cost: numOrNull(r[10]), general_total: numOrNull(r[11]), subbed_margin: numOrNull(r[12]),
        trucks_stood: numOrNull(r[13]), trucks_vor: numOrNull(r[14])
      });
    });

    if (weeks.length === 0) {
      showError('No week rows found in the Dashboard sheet\'s weekly data table.');
      evt.target.value = '';
      return;
    }

    var res = await fetch(PLG.EDGE_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'x-admin-secret': secret},
      body: JSON.stringify({action: 'revenue_upsert', weeks: weeks})
    });
    var result = await res.json();
    if (!res.ok || result.error) {
      showError('Upload failed: ' + (result.error || ('HTTP ' + res.status)));
      evt.target.value = '';
      return;
    }
    showNotice('Uploaded ' + result.count + ' week' + (result.count !== 1 ? 's' : '') + ' successfully. Note: this updates weekly totals only \u2014 the daily breakdown view keeps its existing data.');
    evt.target.value = '';
    loadRevenueData();
  } catch (e) {
    showError('Could not read file: ' + e.message);
    evt.target.value = '';
  }
}
function numOrNull(v) { return (v === undefined || v === null || v === '') ? null : (typeof v === 'number' ? v : parseFloat(v)) || 0; }

window.addEventListener('load', function() {
  loadRevenueData();
  if (sessionStorage.getItem('plg_role') === 'admin') {
    document.getElementById('rp-admin-controls').style.display = 'block';
  }
});
</script>
