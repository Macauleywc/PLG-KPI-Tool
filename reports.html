<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="shared/config.js"></script>
<script src="shared/auth-guard.js" data-module="reports"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — PLG Central</title>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/platform.css">
<style>
/* ── Page toolbar (search / count / admin actions) ── */
.hdr {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 14px 28px; display: flex; align-items: center; gap: 20px;
  position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-sm);
}
.hdr-mid { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.search-wrap {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 7px; padding: 0 12px; height: 36px; transition: border-color 0.15s;
  width: 100%; max-width: 280px;
}
.search-wrap:focus-within { border-color: var(--orange); background: var(--surface); }
.search-wrap svg { color: var(--muted); flex-shrink: 0; }
.search-input { border: none; background: none; font-size: 13px; font-family: 'Figtree', sans-serif; color: var(--text); width: 100%; outline: none; }
.search-input::placeholder { color: var(--muted); }
.count-badge {
  font-size: 12px; font-weight: 500; color: var(--muted);
  background: var(--surface); border: 1px solid var(--border);
  padding: 4px 12px; border-radius: 20px; white-space: nowrap; flex-shrink: 0;
}
#s-total, #s-data, #s-best, #s-bestname, #s-att { display: none; }

.hdr-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 7px; border: 1px solid var(--border);
  background: var(--surface); color: var(--muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all 0.15s;
}
.icon-btn:hover { background: var(--faint); color: var(--text); }

.btn {
  height: 36px; padding: 0 18px; border-radius: 7px; border: none;
  cursor: pointer; font-size: 13px; font-family: 'Figtree', sans-serif;
  font-weight: 600; transition: all 0.12s; display: flex; align-items: center; gap: 6px;
  flex-shrink: 0;
}
.btn:active { transform: scale(0.97); }
.btn-outline { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }
.btn-outline:hover { background: var(--faint); color: var(--text); }
.btn-primary { background: var(--orange); color: #fff; }
.btn-primary:hover { background: var(--orange-dk); }

/* ── Grid ── */
.grid-wrap { max-width: 1280px; margin: 0 auto 60px; padding: 20px 28px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }

/* ── Customer cards ── */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px;
  cursor: pointer; transition: box-shadow 0.15s, transform 0.15s;
  position: relative; overflow: hidden;
  box-shadow: var(--shadow-sm); display: flex; flex-direction: column; min-height: 160px;
}
.card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0;
  height: 3px; background: var(--border); transition: background 0.18s;
}
.card.card--good::before  { background: var(--green); }
.card.card--warn::before  { background: var(--amber); }
.card.card--bad::before   { background: var(--red); }
.card:not(.has-data):hover::before { background: var(--orange); }
.card.card--good:hover::before { background: #166534; }
.card.card--warn:hover::before { background: #92400E; }
.card.card--bad::before   { background: var(--red); }
.card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
.edit-mode .card { cursor: default; }
.edit-mode .card:hover { transform: none; box-shadow: var(--shadow-sm); }
.card-head {
  display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px;
}
.avatar {
  width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
  background: var(--orange-dim); color: var(--orange);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; margin-top: 1px;
}
.card-name {
  flex: 1; font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.4;
}
.del-btn {
  width: 26px; height: 26px; flex-shrink: 0; border-radius: 6px;
  background: var(--faint); border: 1px solid var(--border);
  color: var(--muted); cursor: pointer; font-size: 13px;
  display: none; align-items: center; justify-content: center; transition: all 0.15s;
}
.del-btn:hover { background: #FEF2F2; border-color: #FCA5A5; color: var(--red); }
.edit-mode .del-btn { display: flex; }
.card-kpi { margin-top: auto; }
.kpi-big { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
.kpi-big.good { color: var(--green); }
.kpi-big.warn { color: var(--amber); }
.kpi-big.bad  { color: var(--red); }
.kpi-big-lbl { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 9px; }
.otif-track { height: 4px; background: var(--faint); border-radius: 2px; overflow: hidden; margin-bottom: 9px; }
.otif-fill { height: 100%; border-radius: 2px; }
.kpi-months { font-size: 11px; color: var(--muted); font-weight: 500; }
.card-no-data { font-size: 12px; color: var(--muted); margin-top: auto; padding-top: 8px; }
.add-card {
  background: transparent; border: 1.5px dashed var(--border);
  border-radius: var(--radius); display: flex; flex-direction: column;
  align-items: center; justify-content: center; min-height: 160px;
  cursor: pointer; transition: all 0.15s;
}
.add-card:hover { border-color: var(--orange); background: var(--orange-dim); }
.add-icon { font-size: 24px; color: #d0cec9; margin-bottom: 7px; transition: color 0.15s; }
.add-card:hover .add-icon { color: var(--orange); }
.add-lbl { font-size: 12px; font-weight: 500; color: var(--muted); }
.empty-state { text-align: center; padding: 60px 0; }
.empty-state-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.3; }
.empty-state-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.empty-state-sub { font-size: 13px; color: var(--muted); }
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.35);
  backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 200;
}
.modal {
  background: var(--surface); border-radius: 12px;
  padding: 28px; width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}
.modal-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
.modal-sub { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
.modal-input {
  width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 7px;
  font-size: 14px; font-family: 'Figtree', sans-serif; color: var(--text); background: var(--bg);
  outline: none; margin-bottom: 14px; transition: border-color 0.15s;
}
.modal-input:focus { border-color: var(--orange); background: var(--surface); }
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; }
.modal-label { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; display: block; }
.token-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: -6px; margin-bottom: 14px; }
.token-status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
.token-status-dot.active { background: #22C55E; }
</style>
</head>
<body>

<div class="plg-layout">
  <div id="plg-sidebar-root"></div>
  <div class="plg-content">

    <div class="hdr">
      <div class="hdr-mid">
        <input type="text" name="username" autocomplete="username" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0" tabindex="-1" aria-hidden="true">
        <input type="password" name="password" autocomplete="current-password" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0" tabindex="-1" aria-hidden="true">
        <div class="search-wrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" class="search-input" id="search" name="kpi-search-query" placeholder="Search customers..." oninput="render()" autocomplete="off">
        </div>
        <div class="count-badge" id="count-badge">--</div>
        <span id="s-total"></span><span id="s-data"></span><span id="s-best"></span><span id="s-bestname"></span><span id="s-att"></span>
      </div>

      <div class="hdr-right">
        <button class="btn btn-outline" id="edit-btn" style="display:none" onclick="toggleEdit()">Manage</button>
        <button class="btn btn-primary" id="add-customer-btn" style="display:none" onclick="showModal()">+ Add customer</button>
        <a class="icon-btn" id="settings-btn" title="Settings" style="display:none" href="settings.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </a>
      </div>
    </div>

    <div class="grid-wrap"><div class="grid" id="grid"></div></div>

  </div>
</div>

<div class="overlay" id="overlay" style="display:none" onclick="if(event.target===this)hideModal()">
  <div class="modal">
    <div class="modal-title">Add customer</div>
    <div class="modal-sub">Enter the customer name as it appears in Qargo</div>
    <input class="modal-input" id="modal-input" type="text" placeholder="e.g. Anand International" onkeydown="if(event.key==='Enter')addCustomer()">
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="hideModal()">Cancel</button>
      <button class="btn btn-primary" id="modal-add-btn" onclick="addCustomer()">Add customer</button>
    </div>
  </div>
</div>



<script>
var OWNER = 'Macauleywc', REPO = 'PLG-KPI-Tool';
var DEFAULTS = ['Anand International','Bonnington Plastics','BPW','Charles Bentley','Christmas Tree','Drivers Pickles','Geodis','Greiner Bio One','Mediq','Monro','Red Monkey','SAF Holland','SAM Mouldings','Sarstedt','Tom Chambers','VPK'];
var editMode = false, meta = {};

window.goTo = function(name) {
  window.location.href = 'customer.html?c=' + encodeURIComponent(name);
};


function slug(n) { return n.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
function inits(n) { return n.split(' ').map(function(w) { return w[0] || ''; }).slice(0, 2).join('').toUpperCase(); }
var customerList = null;
function getList() {
  if (Array.isArray(customerList)) return customerList;
  try { var a = JSON.parse(localStorage.getItem('plg_customers')); if (Array.isArray(a) && a.length > 0) return a; } catch(e) {}
  return DEFAULTS.slice();
}
function cacheList(a) { localStorage.setItem('plg_customers', JSON.stringify(a)); }
function otifClass(v) { if (v == null) return ''; return parseFloat(v) >= 98 ? 'good' : parseFloat(v) >= 95 ? 'warn' : 'bad'; }

function delCustomer(name) {
  if (!confirm('Remove ' + name + ' from the portal? This removes it for everyone.')) return;
  var secret = getAdminSecret();
  if (!secret) { alert('Admin secret required to remove a customer. Set it via the Users panel first.'); return; }
  fetch(PLG.EDGE_URL, {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'x-admin-secret': secret},
    body: JSON.stringify({action: 'remove_customer', name: name})
  }).then(function(r){ return r.json(); }).then(function(data){
    if (data.error) { alert('Error removing customer: ' + data.error); return; }
    customerList = data.customers; cacheList(customerList);
    delete meta[name]; render();
  }).catch(function(e){ alert('Error removing customer: ' + e.message); });
}


function render() {
  var list = getList();
  var q = (document.getElementById('search').value || '').toLowerCase();
  var filtered = q ? list.filter(function(n) { return n.toLowerCase().indexOf(q) >= 0; }) : list.slice();
  filtered.sort(function(a,b){ return a.localeCompare(b); });

  document.getElementById('s-total').textContent = list.length;
  document.getElementById('count-badge').textContent = filtered.length + ' customer' + (filtered.length !== 1 ? 's' : '');

  var withData = 0, bestOTIF = null, bestName = '', att = 0;
  list.forEach(function(n) {
    var m = meta[n];
    if (m && m.months > 0) {
      withData++;
      if (m.otif != null) {
        if (bestOTIF === null || parseFloat(m.otif) > parseFloat(bestOTIF)) { bestOTIF = m.otif; bestName = n; }
        if (parseFloat(m.otif) < 95) att++;
      }
    }
  });
  document.getElementById('s-data').textContent = withData;
  document.getElementById('s-best').textContent = bestOTIF != null ? bestOTIF + '%' : '--';
  document.getElementById('s-bestname').textContent = bestName || 'No data yet';
  document.getElementById('s-att').textContent = att;

  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  grid.className = 'grid' + (editMode ? ' edit-mode' : '');

  if (filtered.length === 0 && q) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-icon">&#128269;</div><div class="empty-state-title">No customers found</div><div class="empty-state-sub">Try a different search term</div></div>';
    return;
  }

  filtered.forEach(function(name) {
    var m = meta[name] || {};
    var hasData = m.months > 0;
    var safeName = name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");

    var otifV = m.otif != null ? parseFloat(m.otif) : null;
    var barW = otifV != null ? Math.min(otifV, 100).toFixed(1) : 0;
    var barC = otifV != null ? (otifV >= 98 ? '#15803D' : otifV >= 95 ? '#B45309' : '#DC2626') : '#ccc';
    var statusClass = hasData && otifV != null ? (otifV >= 98 ? ' card--good' : otifV >= 95 ? ' card--warn' : ' card--bad') : '';

    var kpiHtml = hasData
      ? '<div class="card-kpi">'
          + '<div class="kpi-big ' + otifClass(m.otif) + '">' + (otifV != null ? otifV.toFixed(1) + '%' : '\u2014') + '</div>'
          + '<div class="kpi-big-lbl">Pallet OTIF</div>'
          + '<div class="otif-track"><div class="otif-fill" style="width:' + barW + '%;background:' + barC + '"></div></div>'
          + '<div class="kpi-months">' + m.months + ' month' + (m.months !== 1 ? 's' : '') + ' of data</div>'
          + '</div>'
      : '<div class="card-no-data">No data saved yet</div>';

    var onclickAttr = editMode ? '' : ' onclick="goTo(\'' + safeName + '\')"';
    var delBtnHtml = editMode ? '<button class="del-btn" onclick="event.stopPropagation();delCustomer(\'' + safeName + '\')">&#215;</button>' : '';

    var html = '<div class="card' + (hasData ? ' has-data' : '') + statusClass + '"' + onclickAttr + '>'
      + '<div class="card-head">'
      + '<div class="avatar">' + inits(name) + '</div>'
      + '<div class="card-name">' + name + '</div>'
      + delBtnHtml
      + '</div>'
      + kpiHtml
      + '</div>';

    grid.insertAdjacentHTML('beforeend', html);
  });

  if (!editMode) {
    grid.insertAdjacentHTML('beforeend', '<div class="add-card" onclick="showModal()"><div class="add-icon">+</div><div class="add-lbl">Add customer</div></div>');
  }
}

async function loadMeta() {
  hideMetaError();
  try {
    var res = await fetch(PLG.KPI_DATA_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'get_many', customers: getList()})
    });
    var payload = await res.json();
    if (!res.ok || payload.error) {
      showMetaError('Could not load KPI data: ' + (payload.error || ('HTTP ' + res.status)) + '. Ask your admin to check the shared data source in Settings.');
      render();
      return;
    }
    Object.keys(payload.data || {}).forEach(function(name) {
      var d = payload.data[name];
      var months = Object.keys(d.months || {}).sort();
      var otif = null, totPlt = 0, totLatePlt = 0, hasPlt = false;
      months.forEach(function(k) {
        var mo = d.months[k]; if (!mo) return;
        totPlt += mo.pallets || 0;
        if (mo.latePallets != null) { totLatePlt += mo.latePallets || 0; hasPlt = true; }
        else if (mo.timeliness != null && mo.pallets) { totLatePlt += Math.round((mo.pallets || 0) * (1 - (mo.timeliness || 0))); hasPlt = true; }
      });
      if (hasPlt && totPlt > 0) otif = ((totPlt - totLatePlt) / totPlt * 100).toFixed(1);
      meta[name] = { months: months.length, otif: otif };
    });
    var errs = payload.errors || {};
    if (Object.keys(errs).length > 0) console.error('loadMeta partial errors:', errs);
  } catch(e) {
    showMetaError('Could not reach the shared data service: ' + e.message);
  }
  render();
}

function showMetaError(msg) {
  var el = document.getElementById('meta-error-banner');
  if (!el) {
    el = document.createElement('div');
    el.id = 'meta-error-banner';
    el.style.cssText = 'background:#FEF2F2;color:#991B1B;border-bottom:1px solid #FCA5A5;padding:10px 28px;font-size:13px;font-weight:500';
    var hdr = document.querySelector('.hdr');
    hdr.parentNode.insertBefore(el, hdr.nextSibling);
  }
  el.textContent = msg;
  el.style.display = 'block';
}
function hideMetaError() {
  var el = document.getElementById('meta-error-banner');
  if (el) el.style.display = 'none';
}

function toggleEdit() { editMode = !editMode; document.getElementById('edit-btn').textContent = editMode ? 'Done' : 'Manage'; render(); }
function showModal() { document.getElementById('overlay').style.display = 'flex'; setTimeout(function() { document.getElementById('modal-input').focus(); }, 50); }
function hideModal() { document.getElementById('overlay').style.display = 'none'; document.getElementById('modal-input').value = ''; }
function addCustomer() {
  var name = document.getElementById('modal-input').value.trim(); if (!name) return;
  var secret = getAdminSecret();
  if (!secret) { alert('Admin secret required to add a customer. Set it via the Users panel first.'); return; }
  var btn = document.getElementById('modal-add-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Adding…'; }
  fetch(PLG.EDGE_URL, {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'x-admin-secret': secret},
    body: JSON.stringify({action: 'add_customer', name: name})
  }).then(function(r){ return r.json(); }).then(function(data){
    if (btn) { btn.disabled = false; btn.textContent = 'Add customer'; }
    if (data.error) { alert('Error adding customer: ' + data.error); return; }
    customerList = data.customers; cacheList(customerList);
    hideModal(); render(); loadMeta();
  }).catch(function(e){
    if (btn) { btn.disabled = false; btn.textContent = 'Add customer'; }
    alert('Error adding customer: ' + e.message);
  });
}
function getAdminSecret() { return localStorage.getItem('plg_admin_secret') || ''; }


async function refreshCustomerList() {
  try {
    var res = await fetch(PLG.KPI_DATA_URL, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'list'})
    });
    var payload = await res.json();
    if (res.ok && Array.isArray(payload.customers)) {
      customerList = payload.customers.slice().sort(function(a,b){return a.localeCompare(b);});
      cacheList(customerList);
      render();
    } else if (payload.error) {
      console.error('refreshCustomerList error:', payload.error);
    }
  } catch(e) {
    console.error('refreshCustomerList failed:', e.message);
  }
}

window.addEventListener('load', function() {
  PLG.renderSidebar('reports');
  document.getElementById('search').value = '';
  render();
  refreshCustomerList().then(loadMeta);
  if (sessionStorage.getItem('plg_role') === 'admin') {
    document.getElementById('edit-btn').style.display = '';
    document.getElementById('add-customer-btn').style.display = '';
    document.getElementById('settings-btn').style.display = '';
  }
  setTimeout(function(){ var s=document.getElementById('search'); if(s && s.value){ s.value=''; render(); } }, 300);
});

</script>
<script src="shared/sidebar.js"></script>
</body>
</html>
