<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="shared/config.js"></script>
<script src="shared/auth-guard.js" data-module="home"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home — PLG Central</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/platform.css">
<style>
.home-header { padding: 32px 36px 8px; }
.home-greeting { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.home-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

.denied-banner {
  display: none; margin: 20px 36px 0; background: #FEF2F2; border: 1px solid #FCA5A5;
  color: #991B1B; padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 500;
}
.denied-banner.show { display: block; }

.tile-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 14px; padding: 24px 36px 40px;
}
.tile {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 22px; text-decoration: none; color: var(--text); box-shadow: var(--shadow-sm);
  transition: box-shadow 0.15s, transform 0.15s; display: flex; flex-direction: column; gap: 12px;
}
.tile:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
.tile-icon {
  width: 38px; height: 38px; border-radius: 9px; background: var(--orange-dim); color: var(--orange);
  display: flex; align-items: center; justify-content: center;
}
.tile-title { font-size: 14px; font-weight: 700; }
.tile-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }
</style>
</head>
<body>

<div class="plg-layout">
  <div id="plg-sidebar-root"></div>
  <div class="plg-content">
    <div class="home-header">
      <div class="home-greeting" id="greeting">Welcome back</div>
      <div class="home-sub">PLG Central — internal platform</div>
    </div>
    <div class="denied-banner" id="denied-banner"></div>
    <div class="tile-grid" id="tile-grid"></div>
  </div>
</div>

<script src="shared/sidebar.js"></script>
<script>
var TILE_ICONS = {
  reports:       '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>',
  import:        '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 21h14a2 2 0 0 0 2-2v-4"/><path d="M3 15v4a2 2 0 0 0 2 2"/></svg>',
  control_tower: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>',
  users:         '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>',
  settings:      '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82"/></svg>'
};
var TILE_DESCRIPTIONS = {
  reports: 'Customer OTIF, KPI dashboards and PDF exports.',
  import: 'Convert customer delivery schedules into Qargo-ready import files.',
  control_tower: 'Live load-sharing and transfer coordination across the VPK Triad network.',
  users: 'Add, remove or adjust access for platform users.',
  settings: 'Connection settings and shared data source configuration.'
};

window.addEventListener('load', function () {
  PLG.renderSidebar('home');
  var name = sessionStorage.getItem('plg_name') || 'there';
  document.getElementById('greeting').textContent = 'Welcome back, ' + name.split(' ')[0];

  var params = new URLSearchParams(window.location.search);
  var denied = params.get('denied');
  if (denied) {
    var b = document.getElementById('denied-banner');
    b.textContent = "You don't have access to that section. Ask an admin to enable it if you need it.";
    b.classList.add('show');
  }

  var role = sessionStorage.getItem('plg_role') || 'user';
  var userModules = [];
  try { userModules = JSON.parse(sessionStorage.getItem('plg_modules') || '[]'); } catch (e) {}

  var tiles = PLG.MODULES.filter(function (m) {
    if (m.key === 'home') return false;
    if (role === 'admin') return true;
    if (m.adminOnly) return false;
    return userModules.indexOf(m.key) > -1;
  });

  var grid = document.getElementById('tile-grid');
  grid.innerHTML = tiles.map(function (m) {
    var target = m.external ? ' target="_blank" rel="noopener"' : '';
    return '<a class="tile" href="' + m.page + '"' + target + '>' +
      '<div class="tile-icon">' + (TILE_ICONS[m.key] || '') + '</div>' +
      '<div><div class="tile-title">' + m.label + '</div>' +
      '<div class="tile-desc">' + (TILE_DESCRIPTIONS[m.key] || '') + '</div></div>' +
      '</a>';
  }).join('');
});
</script>
</body>
</html>
